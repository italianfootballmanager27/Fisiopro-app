<!DOCTYPE html>
<html lang="it" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FisioPro Clinical - PWA Fisioterapia</title>
    
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="./icon-512.png">
    <meta name="theme-color" content="#0284c7">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            700: '#0369a1',
                            900: '#0c4a6e',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome per le icone -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 h-full flex flex-col antialiased">

    <!-- Header Principale -->
    <header class="bg-brand-700 text-white shadow-md sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-white/10 p-2 rounded-xl backdrop-blur-sm">
                    <i class="fa-solid fa-heart-pulse text-2xl text-brand-100"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold tracking-tight">FisioPro Clinical</h1>
                    <p class="text-xs text-brand-100 opacity-90">Piattaforma Professionale di Fisioterapia</p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="toggleModal('timer-modal')" class="bg-brand-600 hover:bg-brand-500 text-white px-3 py-1.5 rounded-lg text-sm font-medium flex items-center space-x-1.5 transition shadow-sm border border-brand-500/50">
                    <i class="fa-solid fa-stopwatch"></i>
                    <span class="hidden sm:inline">Timer Clinico</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Barra di Ricerca Globale -->
    <div class="bg-white border-b border-slate-200 px-4 py-3 sticky top-[57px] z-30 shadow-sm">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row gap-3 items-center justify-between">
            <div class="relative w-full sm:w-96">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                    <i class="fa-solid fa-search"></i>
                </span>
                <input type="text" id="global-search" oninput="filterContent()" placeholder="Cerca patologia, trattamento, test..." class="w-full pl-10 pr-4 py-2 bg-slate-100 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:bg-white transition">
            </div>
            <!-- Filtro Distretto / Categoria -->
            <div class="flex items-center space-x-2 w-full sm:w-auto overflow-x-auto pb-1 sm:pb-0" id="filter-chips">
                <button onclick="filterByDistrict('all')" class="filter-btn active-chip px-3 py-
